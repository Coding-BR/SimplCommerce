version: '3.8'

services:
  frontend:
    build:
      context: ./frontend/BlazorClient
      dockerfile: Dockerfile
    container_name: idealcreative-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idealcreative-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - idealcreative-dataprotection:/home/app/.aspnet/DataProtection-Keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=idealcreative;Username=postgres;Password=EcYVW5Y6fAll62opS3CTgvK0hdZrVunc;Pooling=true;
      - Jwt__Issuer=https://www.idealcreative.com.br
      - Jwt__Key=IdealCreative-Production-Secret-Jwt-Key-2026-ARM64!
      - Admin__Email=admin@idealcreative.com.br
      - Admin__Password=IdealCreative#2026
      - Storage__Endpoint=minio:9000
      - Storage__AccessKey=idealcreative
      - Storage__SecretKey=EcYVW5Y6fAll62opS3CTgvK0hdZrVunc
      - Storage__Bucket=idealcreative
      - Storage__PublicBaseUrl=https://www.idealcreative.com.br/api/storage/public
      - Storage__ProxyBaseUrl=https://www.idealcreative.com.br
      - Storage__UseSsl=false
      - Frontend__PublicUrl=https://www.idealcreative.com.br
      - Cors__Origins__0=https://www.idealcreative.com.br
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: idealcreative-db
    restart: always
    environment:
      - POSTGRES_DB=idealcreative
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=EcYVW5Y6fAll62opS3CTgvK0hdZrVunc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idealcreative"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  idealcreative-dataprotection:
